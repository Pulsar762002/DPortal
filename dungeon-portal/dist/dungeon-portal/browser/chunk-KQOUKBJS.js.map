<section class="minori-section">

  <h2 class="section-title">
    Avversari e antagonisti
  </h2>

  <p class="section-intro">
    Fazioni e nemici affrontati nel corso della campagna:
  </p>

  <app-personaggio-card
    *ngFor="let p of personaggi$ | async"
    [nome]="p.nome"
    [specieClasse]="p.specieClasse"
    [descrizione]="p.descrizione"
    [ruolo]="p.ruolo"
    [immagine]="p.immagine">
  </app-personaggio-card>

</section>
