<section class="personaggi-section">

  <h2 class="section-title">
    Personaggi principali della campagna
  </h2>

  <app-personaggio-card
    *ngFor="let p of personaggi$ | async"
    [nome]="p.nome"
    [specieClasse]="p.specieClasse"
    [descrizione]="p.descrizione"
    [ruolo]="p.ruolo"
    [immagine]="p.immagine">
  </app-personaggio-card>

</section>
