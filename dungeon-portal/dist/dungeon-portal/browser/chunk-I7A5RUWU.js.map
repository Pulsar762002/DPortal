<div class="campaign-detail-container">

    <div class="campaign-card">

        <!-- HEADER -->
        <header class="campaign-header">

            <h1 class="campaign-title">
                {{ campaign?.title }}
            </h1>

            <p class="campaign-description">
                {{ campaign?.description }}
            </p>

        </header>

        <!-- INDEX -->
        <nav class="campaign-index">

            <section
                    class="index-section"
                    *ngFor="let section of campaign?.sections">

                <h2 class="index-title">
                    {{ section.title }}
                </h2>

                <!-- SESSIONI GRID -->
                <ul
                        *ngIf="section.type === 'sessions'; else normalList"
                        class="index-list sessions-grid">

                    <li
                            *ngFor="let item of section.items">

                        <ng-container
                                *ngIf="isVisible(item)">

                            <a
                                    [routerLink]="[
                                        '/campagne',
                                        slug,
                                        'sessione',
                                        item.sessionNumber
                                    ]">

                                <span class="index-number">
                                    {{ item.sessionNumber }}
                                </span>

                                <span class="index-text">
                                    {{ item.label }}
                                </span>

                            </a>

                        </ng-container>

                    </li>

                </ul>

                <!-- ALTRE LISTE -->
                <ng-template #normalList>

                    <ul
                            class="index-list"
                            [class.secondary]="section.type === 'links'">

                        <li
                                *ngFor="let item of section.items">

                            <ng-container
                                    *ngIf="isVisible(item)">

                                <a
                                        [routerLink]="getRoute(item)"
                                        [fragment]="item.fragment">

                                    {{ item.label }}

                                </a>

                            </ng-container>

                        </li>

                    </ul>

                </ng-template>

            </section>

        </nav>

    </div>

</div>
