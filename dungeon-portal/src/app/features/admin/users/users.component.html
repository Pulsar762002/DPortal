<div class="admin-wrapper">
  <div class="admin-card">

    <h2 class="admin-title">Gestione Utenti</h2>

    <table class="users-table">
      <thead>
      <tr>
        <th>Email</th>
        <th>Nickname</th>
        <th>Ruolo</th>
        <th>Stato</th>
        <th>Azioni</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let user of users">

        <td>{{ user.email }}</td>
        <td>{{ user.nickname || '-' }}</td>

        <td>
            <span class="role-badge" [ngClass]="user.role.toLowerCase()">
              {{ user.role }}
            </span>
        </td>

        <td>
            <span class="status-badge" [ngClass]="user.isActive ? 'active' : 'inactive'">
              {{ user.isActive ? 'Attivo' : 'Disabilitato' }}
            </span>
        </td>

        <td>
          <div class="action-buttons">
            <button class="user" (click)="requestRoleChange(user, 'USER')">User</button>
            <button class="master" (click)="requestRoleChange(user, 'MASTER')">Master</button>
            <button class="admin" (click)="requestRoleChange(user, 'ADMIN')">Admin</button>
            <button (click)="openEdit(user)">Modifica</button>
            <button class="toggle" (click)="toggleActive(user)">
              {{ user.isActive ? 'Disabilita' : 'Abilita' }}
            </button>
            <button class="delete" (click)="requestDelete(user)">Elimina</button>
          </div>
        </td>

      </tr>
      </tbody>
    </table>

  </div>
</div>
<app-confirm-dialog
  *ngIf="showConfirm"
  [title]="'Cambio Ruolo'"
  [message]="'Sei sicuro di voler assegnare il ruolo ' + pendingRole + ' a ' + pendingUser?.email + '?'"
  (confirmed)="confirmChange()"
  (closed)="showConfirm = false">
</app-confirm-dialog>
<app-edit-user-dialog
  *ngIf="showEditDialog"
  [user]="selectedUser"
  (saved)="handleSave($event)"
  (closed)="showEditDialog = false">
</app-edit-user-dialog>
<app-confirm-dialog
  *ngIf="showDeleteConfirm"
  [title]="'Elimina Utente'"
  [message]="'Sei sicuro di voler eliminare definitivamente ' + pendingUser?.email + '? L\'operazione non è reversibile.'"
  (confirmed)="confirmDelete()"
  (closed)="showDeleteConfirm = false">
</app-confirm-dialog>
