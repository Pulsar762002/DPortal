<div class="come-si-gioca-container" *ngIf="indice$ | async as indice">

  <div class="page-header">
    <h1 class="page-title">Come si gioca</h1>
    <p class="page-intro">Tutto quello che serve sapere prima di sedersi al tavolo.</p>
  </div>

  <!-- TAB CATEGORIE -->
  <nav class="categorie-tabs" *ngIf="indice.categorie.length > 1">
    <button
        *ngFor="let categoria of indice.categorie"
        type="button"
        class="tab-button"
        [class.active]="categoria.id === categoriaAttiva"
        (click)="selezionaCategoria(categoria)">
      {{ categoria.titolo }}
    </button>
  </nav>

  <!-- GRIGLIA ARGOMENTI -->
  <div class="argomenti-grid">
    <a
        *ngFor="let argomento of argomentiVisibili(indice)"
        class="argomento-card"
        [routerLink]="['/campagne', slug, 'come-si-gioca', argomento.id]">

      <div class="argomento-image">
        <img [src]="argomento.immagine" [alt]="argomento.titolo" loading="lazy">
      </div>

      <div class="argomento-info">
        <span class="argomento-titolo">{{ argomento.titolo }}</span>
        <span class="argomento-sommario" *ngIf="argomento.sommario">{{ argomento.sommario }}</span>
      </div>

    </a>
  </div>

  <p class="argomenti-vuoto" *ngIf="!indice.categorie.length">
    Contenuto non ancora disponibile per questa campagna.
  </p>

</div>
