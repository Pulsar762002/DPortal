<div class="dynamic-session">

    <div class="session-layout">

        <!-- SIDEBAR -->
        <aside class="session-sidebar">

            <div class="sidebar-card">

                <div class="sidebar-title-row">

                    <h3>{{ session.title }}</h3>

                    <button
                            *ngIf="session.videoId"
                            class="sidebar-play"
                            type="button"
                            (click)="openVideo(session.videoId, 0, session.title)">
                        ▶
                    </button>

                </div>

                <ul>

                    <li *ngFor="let chapter of session.chapters">

                        <a
                                href=""
                                (click)="scrollToChapter($event, chapter.id)">

                            {{ chapter.title }}

                        </a>

                    </li>

                </ul>

            </div>

        </aside>

        <!-- CONTENT -->
        <main class="session-content">

            <div class="content-card">

                <section
                        *ngFor="let chapter of session.chapters"
                        [id]="chapter.id"
                        class="chapter">

                    <!-- TITLE -->
                    <div class="chapter-title-row">

                        <h2>{{ chapter.title }}</h2>

                        <button
                                *ngIf="chapter.videoId"
                                class="chapter-play"
                                type="button"
                                (click)="openVideo(chapter.videoId, 0, chapter.title)">
                            ▶
                        </button>

                    </div>


                    <!-- BLOCKS -->
                    <div class="chapter-blocks">
                        <ng-container *ngFor="let block of chapter.blocks || []">

                            <!-- PARAGRAPH -->
                            <p *ngIf="block.type === 'paragraph'"
                               [ngClass]="{
                                   'paragraph-emphasis': block.variant === 'emphasis',
                                   'paragraph-italic': block.style === 'italic'
                               }"
                               [innerHTML]="block.text">
                            </p>

                            <!-- SUBTITLE -->
                            <app-subtitle-block
                                    *ngIf="block.type === 'subtitle'"
                                    [block]="block">
                            </app-subtitle-block>

                            <!-- QUOTE -->
                            <blockquote *ngIf="block.type === 'quote'">

                                {{ block.text }}

                                <cite *ngIf="block.author" class="quote-author">— {{ block.author }}</cite>

                            </blockquote>

                            <!-- IMAGE -->
                            <img
                                    *ngIf="block.type === 'image'"
                                    [src]="block.src"
                                    [alt]="block.alt || chapter.title"
                                    [ngClass]="'chapter-image-' + block.variant"
                            />

                            <!-- SCENE -->
                            <app-scene-block
                                    *ngIf="block.type === 'scene'"
                                    [block]="block">
                            </app-scene-block>

                            <!-- DIVIDER -->
                            <app-divider-block
                                    *ngIf="block.type === 'divider'"
                                    [block]="block">
                            </app-divider-block>

                            <!-- NOTE -->
                            <app-note-block
                                    *ngIf="block.type === 'note'"
                                    [block]="block">
                            </app-note-block>

                            <!-- LIST -->
                            <app-list-block
                                    *ngIf="block.type === 'list'"
                                    [block]="block">
                            </app-list-block>

                            <!-- SPACER -->
                            <app-spacer-block
                                    *ngIf="block.type === 'spacer'"
                                    [block]="block">
                            </app-spacer-block>

                        </ng-container>
                    </div>

                </section>

            </div>

        </main>

    </div>

    <!-- VIDEO MODAL -->
    <div
            class="video-modal-overlay"
            *ngIf="isVideoOpen"
            (click)="closeVideo()"
            role="presentation">

        <div
                class="video-modal"
                role="dialog"
                aria-modal="true"
                [attr.aria-label]="activeVideoTitle || 'Video della sezione'"
                (click)="$event.stopPropagation()">

            <button
                    class="video-close"
                    type="button"
                    (click)="closeVideo()"
                    aria-label="Chiudi">
                ✕
            </button>

            <div class="video-frame">

                <iframe
                        *ngIf="activeVideoUrl"
                        [src]="activeVideoUrl"
                        title="Video sessione"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                </iframe>

            </div>

        </div>

    </div>

</div>
