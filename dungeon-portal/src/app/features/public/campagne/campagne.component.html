<div class="campaign-section">

  <!-- Campagne registrate via Land/Campagna (API-driven) -->
  <div class="campaign-card" *ngFor="let c of campagne">

    <div class="campaign-header">
      <h2>{{ c.nome }}</h2>
    </div>

    <div class="campaign-content">
      <div class="campaign-text" *ngIf="paragrafi(c.descrizione) as ps">
        <p *ngFor="let p of ps; let first = first; let last = last"
           [class.intro]="first"
           [class.final]="last && ps.length > 1">
          {{ p }}
        </p>
        <p *ngIf="ps.length === 0" class="descrizione">Una nuova cronaca sta per iniziare.</p>

        <p class="final">
          <a [routerLink]="['/campagne', c.slug]" class="chronicles-button">
            Vai alle cronache
          </a>
        </p>
      </div>

      <div class="campaign-party" *ngIf="c.immagineUrl">
        <img [src]="c.immagineUrl" [alt]="'Immagine campagna ' + c.nome">
      </div>
    </div>

    <div class="campaign-footer">
      Master: &#64;{{ c.masterNickname }}
    </div>

  </div>

</div>
