<section class="alleati-section">

  <h2 class="section-title">
    Alleati e PNG incontrati della campagna
  </h2>

  <app-personaggio-card
    *ngFor="let p of personaggi$ | async"
    [nome]="p.nome"
    [specieClasse]="p.specieClasse"
    [descrizione]="p.descrizione"
    [ruolo]="p.ruolo"
    [immagine]="p.immagine">
  </app-personaggio-card>

</section>
